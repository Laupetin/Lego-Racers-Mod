name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-release-linux:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable i386 architecture
        run: dpkg --add-architecture i386

      - name: Install base packages
        run: |
          apt-get update
          apt-get install -y wget tar git make curl

      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          submodules: recursive

      - name: Configure gcc
        uses: ./.github/actions/configure-gcc
        with:
          gcc_version: 14
          enable_x86: true

      - name: Premake generate
        working-directory: ${{ github.workspace }}
        env:
          PREMAKE_NO_PROMPT: 1
        run: ./generate.sh --cc=gcc

      - name: Build
        working-directory: ${{ github.workspace }}
        run: |
          export PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
          echo "Package config path: $PKG_CONFIG_PATH"
          scripts/build.sh release
          chmod +x build/bin/Release_x86/{AssetConverter,JamFileTool,lrcompile}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lego-racers-mod-linux
          path: |
            ${{ github.workspace }}/build/bin/Release_x86

  build-release-windows:
    runs-on: windows-2025-vs2026
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3.0.0

      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          submodules: recursive

      - name: Premake generate
        working-directory: ${{ github.workspace }}
        env:
          PREMAKE_NO_PROMPT: 1
        run: ./generate.bat

      - name: Build
        working-directory: ${{ github.workspace }}
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=Win32 build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lego-racers-mod-windows
          path: |
            ${{ github.workspace }}/build/bin/Release_x86

  release:
    needs:
      - build-release-linux
      - build-release-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Zip artifacts
        run: |
          7z a lego-racers-mod-linux.tar ./lego-racers-mod-linux/*
          7z a lego-racers-mod-linux.tar.gz ./lego-racers-mod-linux.tar
          7z a lego-racers-mod-windows.zip ./lego-racers-mod-windows/*
      - uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifacts: "lego-racers-mod-linux.tar.gz,lego-racers-mod-windows.zip"
          artifactErrorsFailBuild: true
          allowUpdates: true
          draft: true
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
